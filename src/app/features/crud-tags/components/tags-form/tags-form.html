<h1>TAGS</h1>
<form (ngSubmit)="onSubmeter(exibicao() === 'CRIAR' ? 'CRIAR' : 'EDITAR')">

  @if(exibicao() !== 'CRIAR'){
  <label for="Id">Id</label>
  <input type="text" id="Id" name="Id" placeholder="Número do Id" disabled [(ngModel)]="tagFormulario.id">
  }

  <label for="Nome">Nome</label>
  <input type="text" id="Nome" name="Nome" placeholder="Nome da Tag" required [(ngModel)]="tagFormulario.name">

  <label for="Descricao">Descrição</label>
  <textarea id="Descricao" name="Descricao" placeholder="Descrição da Tag"
    [(ngModel)]="tagFormulario.description"></textarea>

  <label for="Tipo">Tipo</label>
  <select id="Tipo" name="Tipo" [(ngModel)]="tagFormulario.type">
    <option value="frontend">Frontend</option>
    <option value="backend">Backend</option>
    <option value="database">Database</option>
  </select>

  <div class="divAcoes">
    <button type="button" class="btnVoltar" (click)="onVoltar()">
      Voltar
    </button>

    @if(exibicao() === 'CRIAR'){
    <button type="button" class="btnCriar" (click)="onSubmeter('CRIAR')">
      Criar
    </button>
    }@else {
    <button type="button" class="btnEditar" (click)="onSubmeter('EDITAR')">
      Editar
    </button>
    }
  </div>

</form>
<a href="#" (click)="$event.preventDefault()">DÚVIDAS!</a>
