@if (carregando()) {
<p class="status" role="status">Carregando tags...</p>
}

@if (erro(); as mensagemErro) {
<div class="erro" role="alert">
  <span>{{ mensagemErro }}</span>
  <button type="button" (click)="erro.set(null)">Fechar</button>
</div>
}

@if (pagina() == "LIST") {
<app-tags-list (eventEdicao)="escutarEventoTelaEdicao($event)"
  (eventTelaNovaTag)="escutarEventoTelaCriacao()" [tagsRecebidas]="repassarDadosTags()"
  (eventExclusao)="escutarEventoExclusao($event)">
</app-tags-list>
} @else {
<app-tags-form [receberDadosEdicao]="repassarDadosEdicao" [receberExibicao]="repassarModeloExibicao"
  (eventVoltarPagina)="escutarEventoVoltarPagina()" (eventOperacaoRealizada)="escutarEventoOperacao($event)">
</app-tags-form>
}
