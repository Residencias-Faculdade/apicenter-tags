@if (carregando()) {
<p class="status" role="status">Carregando tags...</p>
}

@if (erro(); as mensagemErro) {
<div class="erro" role="alert">
  <span>{{ mensagemErro }}</span>
  <button type="button" (click)="erro.set(null)">Fechar</button>
</div>
}

@if (pagina() === 'LIST') {
<app-tags-list (edicaoSolicitada)="onEdicaoSolicitada($event)"
  (criacaoSolicitada)="onCriacaoSolicitada()" [tags]="tags()"
  (exclusaoSolicitada)="onExclusaoSolicitada($event)">
</app-tags-list>
} @else {
<app-tags-form [tagParaEdicao]="tagEmEdicao" [exibicao]="exibicao"
  (voltarSolicitado)="onVoltarSolicitado()" (operacaoRealizada)="onOperacaoRealizada($event)">
</app-tags-form>
}
